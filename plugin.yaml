name: inbox-sentinel
version: 0.1.0
author: Edd Withers
description: >-
  Watches Gmail or IMAP inboxes and surfaces messages that matter. Can
  draft replies when appropriate. Best with the new Hermes app by Nous
  Research, currently in beta; other `hermes send` targets still work.
license: MIT
homepage: https://github.com/eddwithers/inbox-sentinel
tags: [email, gmail, imap, push, notifications, mobile]
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"

provides_tools:
  - inbox_sentinel_status
  - inbox_sentinel_test
  - inbox_sentinel_feedback

provides_hooks:
  - on_session_start
  - pre_llm_call

optional_env:
  - name: INBOX_SENTINEL_CLIENT_ID
    description: Google Cloud OAuth client ID (Desktop app type) for Gmail access
  - name: INBOX_SENTINEL_CLIENT_SECRET
    description: Google Cloud OAuth client secret for Gmail access
    secret: true
  - name: INBOX_SENTINEL_IMAP_PASSWORD2
    description: IMAP password for the second account slot (multi-account registry)
    secret: true
  - name: INBOX_SENTINEL_IMAP_PASSWORD3
    description: IMAP password for the third account slot (multi-account registry)
    secret: true
  - name: INBOX_SENTINEL_IMAP_PASSWORD4
    description: IMAP password for the fourth account slot (multi-account registry)
    secret: true

oauth:
  - id: gmail
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
    client_id_env: INBOX_SENTINEL_CLIENT_ID
    client_secret_env: INBOX_SENTINEL_CLIENT_SECRET
    hosts: [gmail.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
  # Multi-account pool (M2): same read-only client, one grant per account.
  # Sign in each separately: hermes auth add inbox-sentinel:gmail2 etc.
  - id: gmail2
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
    client_id_env: INBOX_SENTINEL_CLIENT_ID
    client_secret_env: INBOX_SENTINEL_CLIENT_SECRET
    hosts: [gmail.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
  - id: gmail3
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
    client_id_env: INBOX_SENTINEL_CLIENT_ID
    client_secret_env: INBOX_SENTINEL_CLIENT_SECRET
    hosts: [gmail.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
  - id: gmail4
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.readonly
    client_id_env: INBOX_SENTINEL_CLIENT_ID
    client_secret_env: INBOX_SENTINEL_CLIENT_SECRET
    hosts: [gmail.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}

python_dependencies: []

config_schema:
  accounts:
    type: str
    default: ""
    description: >-
      Multi-account registry (M2): a JSON list of up to 4 accounts, each
      {"id", "label", "provider": gmail|imap, "enabled", "oauth_id" (gmail:
      gmail|gmail2|gmail3|gmail4), "password_env" (imap: the declared
      INBOX_SENTINEL_IMAP_PASSWORD pool), "gmail_query", "imap_host/port/
      ssl/user/folder", "importance_profile", "delivery_target"}. Empty =
      legacy single-account mode (the flat settings below). Credentials
      never go in this JSON — sign in per account with hermes auth add
      inbox-sentinel:<oauth_id>; IMAP passwords live in the masked secret
      fields. Invalid configuration stops polling; [] watches no accounts.
      Every Gmail entry needs a distinct grant id. Use a new account id
      when changing its connection.
  mode:
    type: str
    default: custom
    choices: [watcher, desk_pa, custom]
    description: >-
      Capability preset over the module toggles. watcher = read-only alerts (scamshield, noisefilter,
      senderlearning, drafter, alertshaper, inboxswitch on; platform guards
      off). desk_pa = all shipped modules on (read-only preview, NOT parity
      with an existing Desk PA; write capabilities are deferred). custom = individual
      toggles. In preset modes the preset wins over individual toggles.
  client_id:
    type: secret
    env: INBOX_SENTINEL_CLIENT_ID
    label: Google OAuth client ID
    description: >-
      From your Google Cloud "Desktop app" OAuth client; enter it in the
      masked host UI when available
  client_secret:
    type: secret
    env: INBOX_SENTINEL_CLIENT_SECRET
    label: Google OAuth client secret
    description: The client secret for the same Google Cloud OAuth client
  enabled:
    type: bool
    default: false
    description: Run the inbox watcher — turn on after completing provider, model and delivery setup
  provider:
    type: str
    default: gmail
    choices: [gmail, imap]
    description: >-
      Mail backend. "gmail" uses Gmail history polling over OAuth.
      "imap" is for servers that accept username/password or app-password
      login over TLS; fill host, user, and password in the masked settings
      UI when available.
  gmail_query:
    type: str
    default: ""
    description: Optional Gmail search scope; nonmatching messages are excluded before header/body/model access
  imap_host:
    type: str
    default: ""
    description: IMAP server hostname (provider=imap)
  imap_port:
    type: int
    default: 993
    description: IMAP server port (993 = IMAPS; plaintext only on literal loopback IPs for tests)
  imap_ssl:
    type: bool
    default: true
    description: >-
      Use IMAPS (TLS). STARTTLS-only and remote plaintext configurations are
      unsupported.
  imap_user:
    type: str
    default: ""
    description: IMAP username / full email address
  imap_password:
    type: secret
    env: INBOX_SENTINEL_IMAP_PASSWORD
    label: IMAP password
    description: >-
      IMAP password or app password. For Gmail-over-IMAP, use a Google app
      password. Store it in the profile secret field, never in chat.
  imap_password2:
    type: secret
    env: INBOX_SENTINEL_IMAP_PASSWORD2
    label: IMAP password (slot 2)
    description: Secret for multi-account slot 2; never put it in accounts JSON
  imap_password3:
    type: secret
    env: INBOX_SENTINEL_IMAP_PASSWORD3
    label: IMAP password (slot 3)
    description: Secret for multi-account slot 3; never put it in accounts JSON
  imap_password4:
    type: secret
    env: INBOX_SENTINEL_IMAP_PASSWORD4
    label: IMAP password (slot 4)
    description: Secret for multi-account slot 4; never put it in accounts JSON
  imap_folder:
    type: str
    default: INBOX
    description: IMAP folder (mailbox) to watch
  poll_interval_seconds:
    type: int
    default: 15
    description: Seconds between Gmail or IMAP polls
  delivery_target:
    type: str
    default: push
    description: >-
      Where alerts go — any `hermes send` target. "push" pings the Hermes
      mobile beta; "none" disables delivery. Live session injection is not supported. Other values name a platform
      target like "telegram" or "discord:#ops".
  importance_profile:
    type: str
    default: ""
    description: >-
      Plain-language description of what matters to you (fed to the
      importance gate). Empty = sensible generic default.
  draft_replies:
    type: bool
    default: true
    description: Pre-draft a reply for important mail
  daily_gate_cap:
    type: int
    default: 100
    description: Maximum classification attempts per day (0-1000); pending mail defers when exhausted
  daily_draft_cap:
    type: int
    default: 15
    description: Max drafted replies per day (spend guardrail)
  draft_max_tokens:
    type: int
    default: 700
    description: Max tokens per drafted reply
  module_scamshield_enabled:
    type: bool
    default: true
    description: >-
      IS-ScamShield module — deterministic pre-gate scam-signal warnings
      (password-protected PDF lures, undisclosed recipients). Never drafts
      replies to flagged mail; over-warns by design.
  module_noisefilter_enabled:
    type: bool
    default: true
    description: >-
      IS-NoiseFilter module — local zero-model-cost drops (recipient aliases,
      quiet labels without a keyword override)
  module_senderlearning_enabled:
    type: bool
    default: true
    description: >-
      IS-SenderLearning module — learned exact-sender rules (always-noise
      drops, always-important rescue and gate override)
  module_attachmentguard_enabled:
    type: bool
    default: true
    description: >-
      IS-AttachmentGuard module — deterministic attachment-risk warnings
      (executables, double extensions, macro documents, HTML attachments,
      password-protected archives)
  module_linkguard_enabled:
    type: bool
    default: true
    description: >-
      IS-LinkGuard module — deterministic suspicious-URL warnings (IP-literal
      links, embedded credentials, punycode, shorteners, high-risk TLDs,
      insecure login URLs)
  module_stormshield_enabled:
    type: bool
    default: true
    description: >-
      IS-StormShield module — suppress identical-repeat alert storms; first
      arrivals always alert and security warnings are never suppressed
  module_drafter_enabled:
    type: bool
    default: true
    description: >-
      IS-Drafter module — reply-draft policy on the post_gate stage:
      deterministic withholds (attachments, incomplete bodies) and drafts
      through the host's budgeted model seam. Off = the host's own draft
      path applies unchanged
  module_alertshaper_enabled:
    type: bool
    default: true
    description: >-
      IS-AlertShaper module — shapes the normal EMAIL ALERT text
      (byte-identical to the host fallback). Off or failing = host shaping
      applies; POSSIBLE SCAM warnings are always host-shaped
  module_inboxswitch_enabled:
    type: bool
    default: true
    description: >-
      IS-InboxSwitch module — multi-account switching policy: disabled-
      account drop invariant and the account tag on multi-account alerts.
      Account connections themselves are host core; off or failing =
      behaviour-identical host fallbacks
  storm_window_minutes:
    type: int
    default: 30
    description: IS-StormShield window (minutes) for counting identical repeats
  storm_threshold:
    type: int
    default: 3
    description: >-
      IS-StormShield: identical arrivals within the window before repeats
      suppress (the first threshold-1 still alert)
  quiet_labels:
    type: list
    default: [CATEGORY_PROMOTIONS, CATEGORY_SOCIAL]
    description: Gmail labels treated as noise before any model call
  keyword_overrides:
    type: list
    default: [appointment, invoice, payment, statement, parcel, booking, urgent, school, medical, flight, delivery]
    description: Subject keywords that override the quiet labels
  skip_recipient_keywords:
    type: list
    default: []
    description: Skip mail addressed to these recipient substrings (e.g. old aliases)
  hermes_send_path:
    type: str
    default: ""
    description: Path to the hermes binary if not on PATH
